name: CI/CD Pipeline

on:
    push:
        branches: ["main", "dev", "feature/*", "hotfix/*"]
    pull_request:
        branches: ["main", "dev"]

concurrency:
    group: tests-${{ github.ref }}
    cancel-in-progress: true

jobs:
    # ==========================================
    # STEP 1: LINTING (Laravel Pint)
    # ==========================================
    lint:
        name: Fix Code Style
        runs-on: ubuntu-latest
        timeout-minutes: 10
        strategy:
            fail-fast: true
            matrix:
                php: [8.4]
        steps:
            - name: Checkout code
              uses: actions/checkout@v5

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php }}
                  tools: pint

            - name: Run Pint
              run: pint

    # ==========================================
    # STEP 2: TESTING (Laravel Pest)
    # ==========================================
    laravel-tests:
        name: Run Laravel Tests
        runs-on: ubuntu-latest
        needs: [lint]

        services:
            postgres:
                image: postgis/postgis:16-3.4
                env:
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_DB: smartbus_testing
                ports: ['5432:5432']
                options: >-
                    --health-cmd "pg_isready -U postgres"
                    --health-interval 5s --health-timeout 5s --health-retries 10

            mysql:
                image: mysql:8.4
                env:
                    MYSQL_ROOT_PASSWORD: root
                    MYSQL_DATABASE: smartbus_users_testing
                ports: ['3306:3306']
                options: >-
                    --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot"
                    --health-interval 5s --health-timeout 5s --health-retries 10

        env:
            DB_URL: ""
            DB_PGSQL_HOST: 127.0.0.1
            DB_PGSQL_PORT: 5432
            DB_PGSQL_DATABASE: smartbus_testing
            DB_PGSQL_USERNAME: postgres
            DB_PGSQL_PASSWORD: postgres
            DB_MYSQL_HOST: 127.0.0.1
            DB_MYSQL_PORT: 3306
            DB_MYSQL_DATABASE: smartbus_users_testing
            DB_MYSQL_USERNAME: root
            DB_MYSQL_PASSWORD: root
        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                php-version: 8.4
                extensions: pdo_pgsql, pdo_mysql, mbstring, intl, bcmath
                coverage: xdebug

            - name: Install Dependencies
              run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

            - name: Setup Node
              uses: actions/setup-node@v6
              with:
                  node-version: lts/*
                  cache: "npm"
                  cache-dependency-path: package-lock.json

            - name: Directory Permissions
              run: chmod -R 777 storage bootstrap/cache

            - name: Run CI Bootstrap
              run: composer run ci

            - name: Install Playwright Browsers
              timeout-minutes: 5
              env:
                DEBIAN_FRONTEND: noninteractive
                NEEDRESTART_MODE: a
                NEEDRESTART_SUSPEND: 1
              run: npx --yes playwright install chromium --with-deps

            - name: Build Frontend Assets
              run: npm run build

            - name: Run Tests
              run: php artisan test --ci --compact